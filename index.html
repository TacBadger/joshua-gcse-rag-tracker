<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17324d"><meta name="apple-mobile-web-app-capable" content="yes"><title>GCSE RAG Tracker v2.3</title><link rel="manifest" href="manifest.webmanifest?v=2.1"><link rel="apple-touch-icon" href="icons/icon-192.png"><style>
:root{--ink:#17324d;--muted:#65758b;--bg:#f4f7fa;--card:#fff;--line:#d9e2ec;--red:#d94a4a;--amber:#d99614;--green:#2f8f5b;--blue:#3478c7}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#1d2939;line-height:1.45}
header{background:var(--ink);color:#fff;padding:18px 20px}h1{margin:0;font-size:1.55rem}header p{margin:3px 0 0;opacity:.85}
nav{display:flex;overflow-x:auto;gap:7px;padding:11px 14px;background:#eaf0f6;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
button{font:inherit;cursor:pointer}nav button,.filterBtn,.actionBtn,.primaryBtn{white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 13px}
nav button.active,.primaryBtn{background:var(--ink);color:#fff;border-color:var(--ink)}
main{max-width:1180px;margin:auto;padding:18px 14px 100px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:15px;box-shadow:0 2px 8px #183b560d}
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}.hero h2{margin:0}.muted{color:var(--muted)}.score{font-size:2.2rem;font-weight:800;color:var(--ink);text-align:center}.score small{display:block;font-size:.75rem;font-weight:400;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:.88rem}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.progress{height:14px;background:#e8edf2;border-radius:99px;overflow:hidden;margin:10px 0 4px}.progress span,.bar span{display:block;height:100%;background:var(--blue)}
.filters{display:flex;gap:8px;flex-wrap:wrap}.filters input{flex:1;min-width:240px;border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit}
.syllabus h3{margin:18px 0 4px}.topic{display:grid;grid-template-columns:minmax(260px,1fr) auto;gap:18px;align-items:center;padding:14px 0;border-top:1px solid #edf1f4}.topic strong{display:block}.topic small{color:var(--muted)}
.rag-controls{display:flex;gap:7px;align-items:center;justify-content:flex-end}.rag-btn{appearance:none;-webkit-appearance:none;width:46px;height:46px;border-radius:11px;border:2px solid currentColor;background:#fff;font-weight:800;font-size:17px;display:inline-flex;align-items:center;justify-content:center;touch-action:manipulation}
.rag-btn.red{color:#b32626}.rag-btn.amber{color:#8b5c00}.rag-btn.green{color:#187044}.rag-btn.blue{color:#2369ad}.rag-btn.clear{color:#687686}.rag-btn.selected{color:#fff;outline:3px solid #172b4d;outline-offset:2px}.rag-btn.red.selected{background:var(--red)}.rag-btn.amber.selected{background:var(--amber)}.rag-btn.green.selected{background:var(--green)}.rag-btn.blue.selected{background:var(--blue)}.rag-btn.clear.selected{background:#687686}
.barRow{display:grid;grid-template-columns:170px 1fr 55px;gap:10px;align-items:center;margin:10px 0}.bar{height:15px;background:#e8edf2;border-radius:99px;overflow:hidden}.tip{border-left:5px solid var(--blue)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#f7f9fb;border:1px solid var(--line);border-radius:12px;padding:13px}.stat strong{display:block;font-size:1.35rem;color:var(--ink)}
.sessionItem{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}.sessionItem .badge{display:inline-block;border-radius:99px;padding:3px 8px;font-size:.78rem;font-weight:700;margin-bottom:6px;background:#edf2f7}
.due{color:#9b1c1c;font-weight:700}.ok{color:#187044;font-weight:700}
.spark{width:100%;height:170px;border:1px solid var(--line);border-radius:12px;background:#fbfcfd}.spark polyline{fill:none;stroke:var(--blue);stroke-width:3}.spark line{stroke:#e5e9ee}.spark text{font-size:10px;fill:#66758a}
.historyTable{width:100%;border-collapse:collapse}.historyTable th,.historyTable td{text-align:left;border-bottom:1px solid #edf1f4;padding:8px;font-size:.9rem}
footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:9px 14px;display:flex;gap:8px;align-items:center;z-index:10}footer span{margin-right:auto;color:var(--muted);font-size:.85rem}
@media(max-width:720px){.hero{grid-template-columns:1fr}.score{text-align:left}.topic{grid-template-columns:1fr}.rag-controls{justify-content:flex-start}.barRow{grid-template-columns:105px 1fr 45px}.grid{grid-template-columns:1fr}footer span{display:none}}

.sectionHead{width:100%;display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;text-align:left;background:#f7f9fb;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:16px 0 5px;color:inherit}
.sectionHead strong{font-size:1rem}.sectionMeta{font-size:.84rem;color:var(--muted);white-space:nowrap}.chev{font-size:1.15rem;color:var(--ink)}
.sectionProgress{height:7px;background:#e5eaf0;border-radius:99px;overflow:hidden;margin-top:6px}.sectionProgress span{display:block;height:100%;background:var(--blue)}
.sectionBody.collapsed{display:none}.sectionActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media(max-width:720px){.sectionHead{grid-template-columns:1fr auto}.sectionMeta{grid-column:1/2}.chev{grid-column:2;grid-row:1/3}}
</style></head><body>

const SUBJECTS={"Maths":{"board":"Pearson Edexcel 1MA1 • Foundation","sections":{"Number":["Order and compare positive and negative integers, decimals and fractions; use equality and inequality symbols.","Use the four operations accurately with integers, decimals, fractions and mixed numbers, including negative values.","Apply place value, inverse operations and the conventional order of operations, including brackets, powers, roots and reciprocals.","Recognise primes, factors, multiples, common factors/multiples, HCF and LCM; use prime factorisation.","Apply systematic listing strategies so all possible outcomes are considered.","Use positive integer powers, square/cube/higher roots and integer indices.","Calculate exactly with fractions and multiples of pi; use standard form for very large and very small numbers.","Move between fractions, decimals and percentages; use fractions and percentages as operators.","Use standard units for length, area, volume, capacity, mass, time and money, including compound measures.","Estimate and check answers; round to decimal places or significant figures; interpret error intervals and limits of accuracy."],"Algebra":["Use standard algebraic notation, including products, powers, quotients, coefficients and brackets.","Substitute numerical values into expressions and formulae, including scientific formulae.","Distinguish expressions, equations, formulae, identities, inequalities, terms and factors.","Simplify expressions by collecting terms, expanding brackets, factorising and applying index laws.","Use standard formulae and rearrange formulae to change the subject.","Show that expressions are equivalent and use algebra to construct and support an argument.","Interpret simple expressions as functions with inputs and outputs.","Use coordinates in all four quadrants; plot and interpret straight-line graphs and use y = mx + c.","Interpret gradients, intercepts, roots and turning points; recognise linear, quadratic, cubic and reciprocal graphs.","Use real-life graphs, including distance/time and other rate-of-change contexts, to find approximate solutions.","Solve linear equations, simple factorisable quadratics and pairs of linear simultaneous equations.","Translate situations into expressions, formulae or equations and interpret solutions in context.","Solve and represent linear inequalities on a number line.","Generate and recognise arithmetic, Fibonacci-type, triangular, square, cube, quadratic and simple geometric sequences.","Find and use nth-term expressions for linear sequences."],"Ratio, proportion and rates of change":["Convert between related standard and compound units and use scales, scale diagrams and maps.","Express one quantity as a fraction or ratio of another and simplify ratios.","Divide quantities in a given part-to-part or part-to-whole ratio and solve contextual ratio problems.","Connect ratios, fractions, proportion and linear relationships.","Calculate percentages, percentage change and reverse percentages, including values above 100%.","Solve direct- and inverse-proportion problems using numerical, graphical and algebraic representations.","Use compound measures such as speed, unit price, density, pressure and rates of pay.","Compare lengths, areas and volumes using ratios and scale factors.","Interpret gradients as rates of change and recognise direct/inverse proportion on graphs.","Solve growth and decay problems, including simple and compound interest."],"Geometry and measures":["Use correct geometric terms and notation; identify parallel/perpendicular lines, vertices, edges, faces, polygons and symmetries.","Carry out ruler-and-compass constructions and solve loci problems.","Apply angle facts for points, lines, triangles, quadrilaterals and parallel lines; use polygon angle sums.","Use properties of special quadrilaterals, triangles and other polygons.","Apply congruence, similarity and scale factors; recognise and construct similar shapes.","Describe and perform rotations, reflections, translations and enlargements, including combinations of transformations.","Use coordinates, including finding midpoints and applying transformations on coordinate grids.","Calculate perimeters and areas of triangles, parallelograms, trapezia and compound shapes.","Calculate circumference and area of circles and solve problems involving arcs, sectors and composite shapes.","Calculate surface area and volume of prisms, cylinders, pyramids, cones and spheres at Foundation demand.","Use plans, elevations, nets and properties of three-dimensional shapes.","Apply Pythagoras' theorem and right-angled trigonometry, including bearings and elevation/depression problems.","Use vector notation for translations and simple geometric relationships."],"Probability":["Use the 0-to-1 probability scale and understand that probabilities of exhaustive outcomes total 1.","Estimate probability from experiments and relative frequency; recognise that larger samples give more reliable estimates.","List outcomes systematically using tables, grids, sample spaces and Venn diagrams.","Calculate probabilities of single and combined events, including mutually exclusive events.","Use frequency trees and tree diagrams, with and without replacement where appropriate.","Distinguish independent and dependent events and use the product rule in accessible contexts."],"Statistics":["Understand populations, samples, sampling methods and the limitations of collected data.","Interpret and construct tables, frequency tables, bar charts, pie charts, line graphs and time-series graphs.","Use stem-and-leaf diagrams, frequency polygons, scatter graphs and other appropriate representations.","Calculate and interpret mean, median, mode and range; select the most suitable measure.","Compare distributions using averages, spread and the shape/context of the data.","Identify correlation, draw and use lines of best fit, and understand that correlation does not prove causation."]}},"Computer Science":{"board":"Pearson Edexcel 1CP2 • Untiered","sections":{"Computational thinking":["Use decomposition and abstraction to model the real world, analyse problems and create manageable solutions.","Explain why subprograms help organise, reuse and test solutions.","Read, follow and write algorithms using flowcharts, pseudocode and program code.","Use sequence, selection, count-controlled and condition-controlled repetition, iteration, input, processing and output.","Use variables, constants, strings, records and one- or two-dimensional arrays.","Apply arithmetic, relational and logical operators.","Trace algorithms, determine outputs and use trace tables to track variable values.","Identify syntax, logic and runtime errors and correct logic errors.","Understand bubble sort, merge sort, linear search and binary search.","Evaluate whether an algorithm is fit for purpose and efficient, considering comparisons, loop passes and memory.","Complete truth tables with up to three inputs using AND, OR and NOT."],"Data":["Explain why computers use binary for numbers, text, images, sound and instructions.","Represent unsigned integers and two's-complement signed integers; convert denary and 8-bit binary values.","Add positive binary values; use logical and arithmetic shifts; identify overflow.","Explain the purpose of hexadecimal and convert between hexadecimal and binary.","Understand 7-bit ASCII character encoding.","Explain bitmap representation using pixels, resolution and colour depth.","Explain digital sound representation using amplitude, sample rate, bit depth and sample interval.","Explain accuracy/quality limitations caused by a restricted number of bits.","Use bit, nibble, byte, KiB, MiB, GiB and TiB; calculate file sizes and storage requirements.","Explain why compression is needed and compare lossy and lossless compression."],"Computers":["Explain the von Neumann stored-program concept and the roles of RAM, the control unit, ALU, registers, clock and buses.","Describe the fetch-decode-execute cycle.","Compare magnetic, optical and solid-state secondary storage.","Explain embedded systems and give suitable applications.","Explain operating-system functions: file, process, peripheral and user management.","Explain utility software: file repair, backup, compression, defragmentation and anti-malware.","Explain robust software and vulnerability identification through audit trails and code review.","Compare low-level and high-level languages and their purposes.","Compare interpreters and compilers."],"Networks":["Explain why computers are networked and compare LANs and WANs.","Describe internet structure using IP addresses and routers.","Explain how wired/wireless characteristics affect speed, range, latency and bandwidth.","Calculate relationships between file size, transmission rate and time using bit-based network units.","Explain Ethernet, Wi-Fi, TCP/IP, HTTP, HTTPS, FTP, POP3, SMTP and IMAP.","Explain the application, transport, internet and link layers of the TCP/IP model.","Compare bus, star and mesh topologies.","Identify vulnerabilities through penetration testing/ethical hacking and protect networks with access control, physical security and firewalls."],"Issues, impact and cybersecurity":["Evaluate energy use, manufacture, replacement cycles and disposal of digital devices.","Evaluate privacy, ownership, consent, misuse and data-protection issues in personal-data collection.","Evaluate accountability, safety, algorithmic bias and liability in AI, machine learning and robotics.","Explain copyright, patents, trademarks and software licensing.","Recognise viruses, worms, Trojans, ransomware and keyloggers.","Explain exploitation of unpatched systems, outdated protection and social engineering.","Protect systems and data through anti-malware, encryption, acceptable-use policies, backups and recovery procedures."],"Problem solving with programming":["Analyse problems using decomposition and abstraction; read, write, refine and evaluate high-level code.","Convert flowcharts and pseudocode into working programs.","Use layout, indentation, comments, meaningful identifiers and whitespace to make maintainable code.","Locate and correct syntax, logic and runtime errors and test fitness for purpose and efficiency.","Use constants, variables, initialisation, assignment, sequence, selection, loops, iteration, data structures, parameters and subprograms.","Use integer, real, Boolean and character data types plus strings, arrays and records.","Manipulate string length, positions, substrings and case.","Accept and validate user input; use length, presence, range and pattern checks.","Read from and write to comma-separated-value text files.","Implement authentication using IDs/passwords and lookups.","Use arithmetic, relational and Boolean operators accurately.","Write and use built-in and user-defined functions/procedures, with and without parameters.","Distinguish local and global variables and choose the appropriate scope."]}},"Geography":{"board":"Pearson Edexcel 1GA0 • Coasts, Rivers, Water","sections":{"Topic 1 - The changing landscapes of the UK":["Locate and describe the UK's main sedimentary, igneous and metamorphic rocks.","Explain how geology and past tectonic processes influenced upland and lowland landscapes.","Explain how glacial, weathering, climatic, river, slope and human processes interact to produce distinctive landscapes.","Coastal landscapes and processes","Explain weathering, mass movement, marine erosion, transportation, longshore drift and deposition.","Explain how geology, structure, rock resistance, constructive/destructive waves, weather, storms and prevailing winds influence coasts.","Explain headlands, bays, caves, arches, stacks, cliffs and wave-cut platforms.","Explain beaches, bars and spits.","Assess effects of urbanisation, agriculture, industry, recession and flooding on people and environments.","Compare sea walls, groynes, rip-rap, beach nourishment and managed retreat.","Apply learning to one named distinctive UK coastal landscape.","River landscapes and processes","Explain weathering, mass movement, erosion, transport and deposition in river landscapes.","Compare upper, middle and lower courses: channel shape, valley profile, gradient, discharge, velocity and sediment.","Explain how storms, droughts and climate affect river processes and landscapes.","Explain interlocking spurs, waterfalls, gorges, river cliffs, floodplains, levees, point bars, meanders and oxbow lakes.","Assess land-use impacts and the physical/human causes and effects of flooding.","Compare dams, reservoirs, channelisation, floodplain zoning and washlands.","Apply learning to one named distinctive UK river landscape.","Use geological and OS maps, cross-sections, GIS, climate/erosion data and storm hydrographs."],"Topic 2 - Weather hazards and climate change":["Explain global atmospheric circulation and ocean-current redistribution of heat.","Describe Quaternary climate change and explain Milankovitch cycles, solar variation and volcanism.","Use ice cores, pollen, tree rings and historical sources as climate evidence.","Explain greenhouse-gas sources and the enhanced greenhouse effect.","Assess impacts including crop yields, sea-level rise and glacier retreat.","Describe the UK's climate, long-term change and spatial variations in temperature, wind and rainfall.","Explain tropical-cyclone formation, characteristics, distribution and changing frequency.","Compare cyclone impacts and responses in one developed and one emerging/developing country.","Explain meteorological, hydrological and human causes of drought and why vulnerability varies.","Compare drought impacts and responses in one developed and one emerging/developing country.","Use climate graphs, cyclone tracks, Saffir-Simpson/storm-surge data, satellite/social-media evidence and socioeconomic data."],"Topic 3 - Ecosystems, biodiversity and management":["Locate tropical, temperate and boreal forests; tropical/temperate grasslands; deserts and tundra.","Explain how climate, soils and altitude influence biome distribution.","Explain how the biosphere supplies food, medicine, materials and fuel and is exploited for energy, water and minerals.","Describe UK moorland, heath, woodland, wetland and marine ecosystems and threats from human activity.","Explain rainforest climate, soils, water, plants, animals, people, nutrient cycling and interdependence.","Explain rainforest biodiversity and plant/animal adaptations.","Assess rainforest goods/services, climate threats, causes of deforestation and sustainable management in one named region.","Explain deciduous woodland characteristics, nutrient cycling, biodiversity and adaptations.","Assess woodland goods/services, climate threats, causes of loss and sustainable management in one named region.","Use world/GIS maps, climate graphs, nutrient-cycle diagrams, population/resource data and sustainability evidence."],"Topic 4 - Changing cities":["Compare urbanisation trends in developed, emerging and developing countries and explain megacity growth.","Describe UK urban distribution and factors affecting city growth/decline.","For one named UK city, know site, situation, connectivity, functions, structure and links to its region.","Explain urbanisation, suburbanisation, counter-urbanisation and re-urbanisation.","Assess population change, migration, inequality, deprivation, accessibility and environmental quality.","Assess regeneration and sustainability strategies in the selected UK city.","For one named major city in an emerging/developing country, know its national/global context and growth.","Assess formal/informal employment, housing, services, inequality, environmental problems and attempts to improve quality of life.","Use maps, satellite images, Census/population data, deprivation measures and urban transects."],"Topic 5 - Global development":["Define development using economic and broader social measures; evaluate GDP/GNI, HDI and other indicators.","Describe global inequalities and explain physical, historical, economic and political causes.","Assess impacts of uneven development on health, education, income, migration and quality of life.","Compare top-down and bottom-up strategies, aid, trade, debt relief and international initiatives.","For one named emerging/developing country, know its location, regional/global role and development profile.","Explain demographic, economic and urban change and the influence of globalisation and transnational corporations.","Assess geopolitical relationships, trade, investment and aid.","Evaluate social, economic and environmental costs/benefits of rapid development."],"Topic 6 - Resource management: Water":["Classify renewable/non-renewable and biotic/abiotic resources; explain uneven global and UK distribution.","Explain why access to food, energy and water affects wellbeing and development.","Describe global freshwater distribution and variations at global, national and local scales.","Explain water surplus/deficit and changing supply/demand over the last 50 years.","Compare agricultural, industrial and domestic water-use patterns between richer and poorer countries.","Explain UK supply problems: rainfall/demand imbalance, seasonality and ageing water/sewage infrastructure.","Explain emerging/developing-country problems: untreated supply, pollution and low rainfall.","Assess stakeholder attitudes, desalination and other responses to shortages.","Explain why sustainable water management is needed and compare approaches in one developed and one emerging/developing country.","Interpret water-supply, demand and stress maps plus population/resource projections."],"Topic 7 - Geographical investigations and fieldwork":["Formulate enquiry questions, justify methods, consider risk/ethics and collect quantitative and qualitative data.","Present, analyse and interpret primary/secondary data; identify anomalies, draw conclusions and evaluate the enquiry.","Complete one physical investigation: either change in a river channel or evidence of coastal processes.","River option minimums: measure discharge, record river landforms qualitatively, consider people in the catchment, use a flood-risk map and one further secondary source.","Coastal option minimums: measure beach morphology/sediment, record coastal landforms qualitatively, consider local people, use a geology map and one further source.","Complete one human investigation: either change in a central/inner urban area or change in a rural settlement.","Urban option minimums: assess environmental quality, measure land use, consider physical-city interactions, use Census data and another source.","Rural option minimums: record people's views, measure flows of people, consider landscape-settlement interactions, use Census data and another source."],"Topic 8 - UK challenges":["Resource consumption and environmental sustainability: population change, ecosystem pressure and sustainable transport.","Settlement, population and economy: the two-speed economy, regional inequality, greenfield/brownfield choices, migration data and stakeholder attitudes.","Landscape challenges: National Park conservation/development and management of river/coastal flood risk.","Climate-change challenges: uncertainty, impacts on UK people/landscapes, and local/national responses.","Use synoptic geographical knowledge, unfamiliar resources, data and evidence to investigate and reach justified conclusions."]}},"RE":{"board":"AQA 8062 • Catholic Christianity + Judaism","sections":{"Catholic Christianity - beliefs and teachings":["The Trinity: Father, Son and Holy Spirit; Nicene Creed; scriptural origins and the Council of Nicaea.","Creation in Genesis 1 and 2; God's nature, human dignity and humanity's relationship with creation; differing Christian interpretations.","Incarnation: Jesus as the divine Word, fully God and fully human.","Redemption: the significance of Jesus' life, death, resurrection and ascension for salvation and grace.","Life after death: resurrection, judgement, heaven, hell and purgatory.","Meaning of sacrament and the sacramental nature of reality.","Names, meanings and effects of baptism, confirmation, reconciliation, anointing of the sick, matrimony, holy orders and Eucharist.","The Eucharist as the source and summit of Christian life and differing Christian views of its meaning."],"Catholic Christianity - practices":["Formal and informal prayer, prayer as raising mind and heart to God, and the Lord's Prayer.","Popular piety: the Rosary and Stations of the Cross.","Pilgrimage, including one Roman Catholic pilgrimage place and differing Christian views.","The Catholic funeral rite and its significance.","Love of neighbour through Catholic social teaching, justice, peace and reconciliation, including Gaudium et Spes paragraph 26.","Work of Catholic agencies such as CAFOD, Trocaire and Missio.","Mission and evangelism locally, nationally and globally.","Aims and importance of the Society of Saint Vincent de Paul.","Aims and importance of either Corrymeela or Pax Christi."],"Judaism - beliefs and teachings":["God as one, Creator, Law-Giver, Judge, loving and merciful.","The divine presence (Shekhinah).","Life after death, judgement and resurrection.","The nature and role of the Messiah, including differing Jewish views.","The promised land and covenant with Abraham (Genesis 12:1-3).","The Sinai covenant, Moses and the Ten Commandments (Exodus 20:1-17).","Justice, healing the world, charity and kindness.","Sanctity of life and Pikuach Nefesh (saving a life).","Free will and the 613 mitzvot.","Mitzvot between humans and God and between one person and another."],"Judaism - practices":["Purpose and importance of the synagogue.","Bimah, aron hakodesh, ner tamid and differences between Orthodox and Reform synagogues.","Public worship and Orthodox/Reform services; prayer including the Amidah.","Shabbat at home and in the synagogue.","Home worship and private prayer.","Tenakh and Talmud: study, use and significance.","Birth ceremonies including Brit Milah; Bar and Bat Mitzvah; marriage; mourning.","Dietary laws: kosher/trefah, separation of milk and meat, and differing views of importance.","Rosh Hashanah, Yom Kippur and Pesach: origins, practices and meanings."],"Component 2 - four themes awaiting confirmation":["Sexuality, relationships, contraception, marriage, cohabitation, divorce/remarriage, families, gender roles, equality, prejudice and discrimination.","Origins/value of the universe and human life, science and religion, stewardship, environmental/animal issues, abortion, euthanasia, death and afterlife.","Design, first-cause and miracle arguments; evil/suffering and science; visions, enlightenment, general/special revelation and the nature of the divine.","Peace, justice, forgiveness, reconciliation, violence, terrorism, reasons for war, just/holy war, pacifism, WMDs, peace-making and aid to victims.","Good/evil, causes and types of crime, aims and methods of punishment, forgiveness, corporal punishment, community service and the death penalty.","Prejudice, discrimination, equality, religious freedom, human rights/responsibilities, social justice, racial discrimination, wealth, poverty, exploitation and charity.","The life of Jesus, discipleship, miracles, suffering/death/resurrection, and the Gospel as a source of religious, moral and spiritual truth."]}},"Biology":{"board":"AQA Combined Science: Trilogy 8464 • Foundation","sections":{"Working scientifically and mathematical skills":["Develop and evaluate scientific explanations, models and theories using evidence.","Form hypotheses; identify independent, dependent and control variables; plan valid, safe investigations.","Select apparatus and techniques; consider accuracy, precision, repeatability, reproducibility and sources of error.","Record observations and measurements using suitable units, significant figures and tables.","Present data using graphs and charts; identify patterns, anomalies, correlations and causal claims.","Calculate means, ranges, percentages, rates, gradients, areas and proportional relationships.","Use standard form, prefixes, unit conversions, formulae and simple probability/statistics at Foundation demand.","Interpret uncertainty and evaluate methods, evidence and conclusions; suggest realistic improvements.","Understand peer review, the development of scientific ideas, risk, ethics and the social/environmental implications of science."],"Cell biology":["Compare eukaryotic and prokaryotic cells; identify animal, plant and bacterial structures and their functions.","Explain cell specialisation and differentiation in animals and plants.","Use microscopy, magnification, scale and standard form; prepare and interpret biological drawings.","Explain chromosomes, the cell cycle and mitosis for growth, repair and asexual reproduction.","Describe stem cells, potential uses and ethical/risk considerations.","Explain diffusion, osmosis and active transport and factors affecting transfer rates."],"Organisation":["Explain the hierarchy from cells to tissues, organs and organ systems.","Describe digestive-system organs, enzymes, substrates/products and effects of temperature and pH.","Use food tests for sugars, starch, protein and lipids.","Describe the heart, blood vessels, blood components and double circulation.","Explain coronary heart disease, treatments and health impacts.","Explain health as physical and mental wellbeing and interactions among diseases.","Evaluate lifestyle and genetic risk factors for cardiovascular disease, obesity, diabetes, liver disease and cancer.","Explain benign/malignant tumours and cancer risk factors.","Describe plant tissues and transport through roots, xylem, phloem and transpiration."],"Infection and response":["Explain communicable disease, pathogen transmission and prevention.","Know examples, symptoms, transmission and control for measles, HIV, tobacco const KEY='gcse-rag-v2';
const METAKEY='gcse-rag-meta-v23';
const HISTKEY='gcse-rag-history-v23';
let state={},meta={},history=[];
try{state=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('gcse-rag-v1')||'{}')}catch{}
try{meta=JSON.parse(localStorage.getItem(METAKEY)||'{}')}catch{}
try{history=JSON.parse(localStorage.getItem(HISTKEY)||'[]')}catch{}
const today=()=>new Date().toISOString().slice(0,10);
const daysBetween=(a,b)=>Math.floor((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);
const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));localStorage.setItem(METAKEY,JSON.stringify(meta));localStorage.setItem(HISTKEY,JSON.stringify(history))};
const topicKey=(s,sec,t)=>s+'::'+sec+'::'+t;
const score=k=>Number(state[k]||0);
function topics(s){let a=[];Object.entries(SUBJECTS[s].sections).forEach(([sec,ts])=>ts.forEach(t=>a.push([sec,t])));return a}
function pct(s){const a=topics(s);return a.length?Math.round(a.reduce((n,[sec,t])=>n+score(topicKey(s,sec,t)),0)/(a.length*4)*100):0}
function overallPct(){const ss=Object.keys(SUBJECTS);return Math.round(ss.reduce((n,s)=>n+pct(s),0)/ss.length)}
function counts(s){let c=[0,0,0,0,0];topics(s).forEach(([sec,t])=>c[score(topicKey(s,sec,t))]++);return c}
function readHash(){try{let h=decodeURIComponent(location.hash.slice(1));return SUBJECTS[h]||['Dashboard','Revise Now'].includes(h)?h:'Maths'}catch{return'Maths'}}
let current=readHash();
function recordHistory(force=false){
 const d=today(),last=history[history.length-1];
 const snap={date:d,overall:overallPct(),subjects:Object.fromEntries(Object.keys(SUBJECTS).map(s=>[s,pct(s)]))};
 if(!last||last.date!==d)history.push(snap);else if(force||last.overall!==snap.overall||JSON.stringify(last.subjects)!==JSON.stringify(snap.subjects))history[history.length-1]=snap;
 if(history.length>180)history=history.slice(-180);save();
}
function setScore(k,v){
 const old=score(k);state[k]=v;
 const m=meta[k]||{};
 m.lastTested=today();m.previous=old;m.updated=today();
 if(v===3)m.retestDue=new Date(Date.now()+7*86400000).toISOString().slice(0,10);
 else if(v===4)m.retestDue=new Date(Date.now()+21*86400000).toISOString().slice(0,10);
 else if(v===1||v===2)m.retestDue=new Date(Date.now()+2*86400000).toISOString().slice(0,10);
 else m.retestDue=null;
 meta[k]=m;recordHistory(true);
}
const legend=`<div class="legend"><span><i class="dot" style="background:var(--red)"></i>Red = cannot yet answer</span><span><i class="dot" style="background:var(--amber)"></i>Amber = partly secure</span><span><i class="dot" style="background:var(--green)"></i>Green = secure independently</span><span><i class="dot" style="background:var(--blue)"></i>Blue = secure after delay</span></div>`;
function renderTabs(){document.getElementById('tabs').innerHTML=[...Object.keys(SUBJECTS),'Revise Now','Dashboard'].map(s=>`<button type="button" data-tab="${s}" class="${s===current?'active':''}">${s}</button>`).join('')}
function dueText(k){const m=meta[k];if(!m?.retestDue)return'';const d=daysBetween(today(),m.retestDue);return d<=0?`<span class="due">Retest due${d<0?' '+Math.abs(d)+'d overdue':''}</span>`:`<span class="muted">Retest in ${d}d</span>`}
function weakest(s){const a=topics(s).sort((x,y)=>score(topicKey(s,...x))-score(topicKey(s,...y)));return a.length?`Start with “${a[0][1]}”.`:''}
function subjectView(s){
 const d=SUBJECTS[s],p=pct(s),c=counts(s);
 let h=`<section class="card hero"><div><h2>${s}</h2><div class="muted">${d.board}</div>${legend}</div><div class="score">${p}%<small>weighted RAG progress</small></div></section>
 <section class="card"><strong>Subject progress</strong><div class="progress"><span style="width:${p}%"></span></div><div class="muted">Unscored ${c[0]} • Red ${c[1]} • Amber ${c[2]} • Green ${c[3]} • Blue ${c[4]}</div></section>
 <section class="card"><div class="filters"><input id="search" placeholder="Find a syllabus topic…"><button class="filterBtn" id="weakBtn">Show Red/Amber only</button></div>`;
 h+=`<div class="sectionActions"><button class="filterBtn" data-sections="expand">Expand all</button><button class="filterBtn" data-sections="collapse">Collapse all</button></div>`;
 Object.entries(d.sections).forEach(([sec,ts])=>{
   const st=secStats(s,sec,ts),op=isOpen(s,sec,ts),sid=secId(s,sec);
   h+=`<div class="syllabus"><button type="button" class="sectionHead" data-section="${sid}" aria-expanded="${op}"><div><strong>${sec}</strong><div class="sectionProgress"><span style="width:${st.pct}%"></span></div></div><span class="sectionMeta">${st.pct}% • ${st.secure}/${st.total} secure${st.redamber?` • ${st.redamber} Red/Amber`:''}</span><span class="chev">${op?'▾':'▸'}</span></button><div class="sectionBody ${op?'':'collapsed'}" data-section-body="${sid}">`;
   ts.forEach(t=>{const k=topicKey(s,sec,t),v=score(k);h+=`<div class="topic" data-text="${(sec+' '+t).toLowerCase()}" data-v="${v}"><div><strong>${t}</strong><small>${sec}${meta[k]?.lastTested?' • Last tested '+meta[k].lastTested:''}</small><div>${dueText(k)}</div></div><div class="rag-controls" data-key="${encodeURIComponent(k)}">${[['red','R',1],['amber','A',2],['green','G',3],['blue','B',4],['clear','×',0]].map(([cl,l,n])=>`<button class="rag-btn ${cl} ${v===n?'selected':''}" data-rag="${n}" type="button">${l}</button>`).join('')}</div></div>`});
   h+='</div></div>';
 });
 return h+`</section><section class="card tip"><strong>Next revision target</strong><div>${weakest(s)}</div></section>`;
}
function candidatePool(){
 let a=[];
 Object.keys(SUBJECTS).forEach(s=>topics(s).forEach(([sec,t])=>{const k=topicKey(s,sec,t),v=score(k),m=meta[k]||{};let priority=0,reason='';
 if(v===1){priority=100;reason='Red topic'}else if(v===2){priority=80;reason='Amber topic'}else if(v===0){priority=60;reason='Not yet scored'}else if(m.retestDue&&daysBetween(today(),m.retestDue)<=0){priority=v===3?75:55;reason='Spaced retest due'}else if(v===3){priority=25;reason='Green maintenance'}else{priority=10;reason='Blue maintenance'}
 if(m.lastTested)priority+=Math.min(20,Math.max(0,daysBetween(m.lastTested,today())));
 a.push({s,sec,t,k,v,priority,reason})}));return a.sort((a,b)=>b.priority-a.priority)
}
function reviseView(){
 const pool=candidatePool(),chosen=[],used=new Set();
 for(const x of pool){if(chosen.length>=3)break;if(!used.has(x.s)||chosen.length>=2){chosen.push(x);used.add(x.s)}}
 return `<section class="card hero"><div><h2>Revise Now</h2><div class="muted">A short session chosen from weak topics and spaced retests.</div></div><div class="score">~30<small>minutes</small></div></section>
 <section class="card tip"><strong>Session routine</strong><div>5 min retrieve → 8 min fix → 10 min exam question → 5 min mark/correct. Rate the topic again after testing it.</div></section>
 <section class="card"><h3>Tonight's three targets</h3>${chosen.map((x,i)=>`<div class="sessionItem"><span class="badge">${i+1} • ${x.reason}</span><strong>${x.s} — ${x.t}</strong><div class="muted">${x.sec}</div><div style="margin-top:8px"><button class="primaryBtn goto" data-subject="${x.s}">Open subject</button></div></div>`).join('')}<button id="shuffleBtn" class="filterBtn">Choose another session</button></section>`;
}
function sparkline(){
 if(history.length<2)return'<p class="muted">Your progress-over-time chart will appear after scores are recorded on more than one day.</p>';
 const a=history.slice(-30),W=700,H=150,pad=22,max=100;
 const pts=a.map((x,i)=>`${pad+i*(W-2*pad)/Math.max(1,a.length-1)},${H-pad-(x.overall/max)*(H-2*pad)}`).join(' ');
 return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}"/><line x1="${pad}" y1="${pad}" x2="${W-pad}" y2="${pad}"/><polyline points="${pts}"/></svg><div class="muted">${a[0].date} → ${a[a.length-1].date}</div>`;
}
function dashboard(){
 const rows=Object.keys(SUBJECTS).map(s=>[s,pct(s)]),overall=overallPct();
 let due=0;Object.values(meta).forEach(m=>{if(m.retestDue&&daysBetween(today(),m.retestDue)<=0)due++});
 const red=Object.keys(SUBJECTS).reduce((n,s)=>n+counts(s)[1],0),amber=Object.keys(SUBJECTS).reduce((n,s)=>n+counts(s)[2],0);
 return `<section class="card hero"><div><h2>Overall progress</h2><div class="muted">Current mastery plus spaced-retrieval status.</div>${legend}</div><div class="score">${overall}%<small>all subjects</small></div></section>
 <section class="grid"><div class="stat"><span class="muted">Red topics</span><strong>${red}</strong></div><div class="stat"><span class="muted">Amber topics</span><strong>${amber}</strong></div><div class="stat"><span class="muted">Retests due</span><strong>${due}</strong></div></section>
 <section class="card"><h3>Progress by subject</h3>${rows.map(([s,p])=>`<div class="barRow"><span>${s}</span><div class="bar"><span style="width:${p}%"></span></div><strong>${p}%</strong></div>`).join('')}</section>
 <section class="card"><h3>Progress over time</h3>${sparkline()}</section>
 <section class="card"><button class="primaryBtn" data-tab="Revise Now">Build tonight's revision session</button></section>`;
}
let sessionSalt=0;
const OPENKEY='gcse-rag-open-v23';
let openSections={};try{openSections=JSON.parse(localStorage.getItem(OPENKEY)||'{}')}catch{}
const secId=(s,sec)=>encodeURIComponent(s+'::'+sec);
function secStats(s,sec,ts){
 let total=ts.length,weighted=0,secure=0,redamber=0;
 ts.forEach(t=>{let v=score(topicKey(s,sec,t));weighted+=v;if(v>=3)secure++;if(v===1||v===2)redamber++});
 return {total,secure,redamber,pct:total?Math.round(weighted/(total*4)*100):0};
}
function isOpen(s,sec,ts){
 const id=secId(s,sec);
 if(Object.prototype.hasOwnProperty.call(openSections,id)) return !!openSections[id];
 return secStats(s,sec,ts).redamber>0; // weak sections open by default
}
function setAllSections(s,val){
 Object.keys(SUBJECTS[s].sections).forEach(sec=>openSections[secId(s,sec)]=val);
 localStorage.setItem(OPENKEY,JSON.stringify(openSections));
}

function render(){renderTabs();document.getElementById('app').innerHTML=current==='Dashboard'?dashboard():current==='Revise Now'?reviseView():subjectView(current);
 if(SUBJECTS[current]){const input=document.getElementById('search'),btn=document.getElementById('weakBtn');let weak=false;const filter=()=>document.querySelectorAll('.topic').forEach(el=>el.style.display=(el.dataset.text.includes(input.value.toLowerCase())&&(!weak||Number(el.dataset.v)<=2))?'grid':'none');input.oninput=filter;btn.onclick=()=>{weak=!weak;btn.textContent=weak?'Show all topics':'Show Red/Amber only';filter()}}
}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;current=b.dataset.tab;location.hash=encodeURIComponent(current);render()};
document.getElementById('app').onclick=e=>{
 const sh=e.target.closest('.sectionHead');
 if(sh&&SUBJECTS[current]){
   const id=sh.dataset.section;openSections[id]=!openSections[id];localStorage.setItem(OPENKEY,JSON.stringify(openSections));render();return;
 }
 const sa=e.target.closest('[data-sections]');
 if(sa&&SUBJECTS[current]){setAllSections(current,sa.dataset.sections==='expand');render();return}
 const r=e.target.closest('.rag-btn');if(r){const g=r.closest('.rag-controls');setScore(decodeURIComponent(g.dataset.key),Number(r.dataset.rag));render();return}const go=e.target.closest('.goto');if(go){current=go.dataset.subject;location.hash=encodeURIComponent(current);render();return}const tab=e.target.closest('[data-tab]');if(tab){current=tab.dataset.tab;location.hash=encodeURIComponent(current);render();return}if(e.target.id==='shuffleBtn'){const p=candidatePool();if(p.length){const x=p.shift();p.push(x)}render()}};
window.addEventListener('hashchange',()=>{current=readHash();render()});
document.getElementById('exportBtn').onclick=()=>{const data={version:'2.1',exported:new Date().toISOString(),state,meta,history};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='gcse-rag-backup-v23.json';a.click()};
document.getElementById('importFile').onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());state=x.state||x;meta=x.meta||{};history=x.history||[];recordHistory(true);render();alert('Backup restored.')}catch{alert('Could not read that backup.')}};
document.getElementById('resetBtn').onclick=()=>{if(confirm('Clear every RAG score, retest date and progress history?')){state={};meta={};history=[];save();render()}};
recordHistory();render();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=2.1'));
</script></body></html>
